<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/catalog"></ion-back-button>
    </ion-buttons>
    <ion-title>Mi perfil</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  @if (user) {
    <div class="profile-header">
      <ion-avatar>
        <img [src]="user.fotoUrl || 'assets/images/logo.png'" alt="Foto de perfil" />
      </ion-avatar>
      <h2>{{ user.nombre }}</h2>
      <p>{{ user.email }}</p>
    </div>
  }

  <ion-list>
    <ion-item>
      <ion-label>Teléfono</ion-label>
      <ion-label slot="end">{{ user?.telefono || '—' }}</ion-label>
    </ion-item>
    <ion-item>
      <ion-label>Rol</ion-label>
      <ion-label slot="end">{{ user?.rol }}</ion-label>
    </ion-item>
    <ion-item>
      <ion-icon name="moon-outline" slot="start"></ion-icon>
      <ion-label>Tema oscuro</ion-label>
      <ion-toggle [checked]="darkMode()" (ionChange)="toggleTheme($event)"></ion-toggle>
    </ion-item>
  </ion-list>

  <ion-button expand="block" color="danger" class="ion-margin-top" (click)="logout()">
    <ion-icon name="log-out-outline" slot="start"></ion-icon>
    Cerrar sesión
  </ion-button>
</ion-content>
