<ion-content class="ion-padding auth-content">
  <div class="auth-wrapper">
    <img src="assets/images/logo.png" alt="Tomen Agüita" class="auth-logo" />
    <h1 class="auth-title">Crear cuenta</h1>
    <p class="auth-subtitle">Regístrate para empezar a comprar</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <ion-list lines="full" class="auth-list">
        <ion-item>
          <ion-input
            label="Nombre completo"
            labelPlacement="floating"
            formControlName="nombre"
            autocomplete="name"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Teléfono (10 dígitos, inicia en 3)"
            labelPlacement="floating"
            type="tel"
            formControlName="telefono"
            autocomplete="tel"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Correo electrónico"
            labelPlacement="floating"
            type="email"
            formControlName="email"
            autocomplete="email"
          ></ion-input>
        </ion-item>
        <ion-item>
          <ion-input
            label="Contraseña"
            labelPlacement="floating"
            type="password"
            formControlName="password"
            autocomplete="new-password"
          ></ion-input>
        </ion-item>
      </ion-list>

      @if (errorMessage) {
        <ion-text color="danger">
          <p class="auth-error">{{ errorMessage }}</p>
        </ion-text>
      }

      <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="loading">
        @if (loading) {
          <ion-spinner name="dots"></ion-spinner>
        } @else {
          <span>Crear cuenta</span>
        }
      </ion-button>
    </form>

    <p class="auth-switch">
      ¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión</a>
    </p>
  </div>
</ion-content>
